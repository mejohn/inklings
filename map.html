<h1>Island map</h1>

<section><b>Show</b><div class="row"><label class="chk"><input type="checkbox" id="tRoad" checked>Roads</label><label class="chk"><input type="checkbox" id="tSea" checked>Sea routes</label></div>

<script>
const KM_PER_UNIT=3.3; // scale: the central island (~9,400 sq units) is Iceland-sized (~103,000 km²)
const TOWN_INFO={}; // e.g. "Trust":"Harbour town. Smugglers' cove under the east pier."
const svg=document.querySelector('#map>svg'),map=document.getElementById('map');
const FULL={x:0,y:0,w:1104,h:825};let vb={...FULL};
const towns={},edges=[],adj={};
document.querySelectorAll('.town').forEach(g=>{const c=g.querySelector('circle');const n=g.dataset.name;
 towns[n]={name:n,g,x:+c.getAttribute('cx'),y:+c.getAttribute('cy'),region:g.dataset.region||'Ring port'};
 const h=document.createElementNS(svg.namespaceURI,'circle');h.setAttribute('class','hit');h.setAttribute('cx',c.getAttribute('cx'));h.setAttribute('cy',c.getAttribute('cy'));h.setAttribute('r',7);g.appendChild(h)});
const pts=p=>p.getAttribute('d').match(/-?[\d.]+,-?[\d.]+/g).map(s=>s.split(',').map(Number));
document.querySelectorAll('.road,.sea-route').forEach(p=>{const kind=p.classList.contains('road')?'road':'sea',a=p.dataset.from,b=p.dataset.to,q=pts(p);
 if(!towns[a])towns[a]={name:a,junction:1,x:q[0][0],y:q[0][1]};if(!towns[b])towns[b]={name:b,junction:1,x:q.at(-1)[0],y:q.at(-1)[1]};
 const e={a,b,kind,el:p,len:p.getTotalLength()};edges.push(e);(adj[a]??=[]).push(e);(adj[b]??=[]).push(e)});
const names=Object.keys(towns).filter(n=>!towns[n].junction).sort();
const $=id=>document.getElementById(id),from=$('from'),to=$('to');
for(const s of[from,to]){s.add(new Option('Choose a town…',''));names.forEach(n=>s.add(new Option(n,n)))}
// layers
const lay={road:$('tRoad'),sea:$('tSea')};
$('tRoad').onchange=()=>{$('kings-road').classList.toggle('off',!$('tRoad').checked);route()};
$('tSea').onchange=()=>{$('sea-routes').classList.toggle('off',!$('tSea').checked);route()};
// view
function apply(){const r=map.getBoundingClientRect(),asp=r.width/r.height;let{x,y,w}=vb;let h=w/asp;
 vb.h=h;svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);map.classList.toggle('zoomed',w<460)}
function fit(){const r=map.getBoundingClientRect(),asp=r.width/r.height;vb.w=Math.max(1104,825*asp);vb.x=(1104-vb.w)/2;vb.y=(825-vb.w/asp)/2;apply()}
function zoomAt(px,py,k){const r=map.getBoundingClientRect(),fx=(px-r.left)/r.width,fy=(py-r.top)/r.height;
 const nw=Math.min(1250,Math.max(70,vb.w*k)),nh=nw*vb.h/vb.w;vb.x+=(vb.w-nw)*fx;vb.y+=(vb.h-nh)*fy;vb.w=nw;apply()}
function flyTo(t,w=260){vb.w=w;apply();vb.x=t.x-vb.w/2;vb.y=t.y-vb.h/2;apply()}
map.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*.0015))},{passive:false});
const ptr=new Map();let moved=0,pinch=0;
map.addEventListener('pointerdown',e=>{map.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(ptr.size==2)pinch=dist()});
const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
map.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];
 if(ptr.size==1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>6)map.classList.add('drag');const r=map.getBoundingClientRect();vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.w/r.width;ptr.set(e.pointerId,[e.clientX,e.clientY]);apply()}
 else{ptr.set(e.pointerId,[e.clientX,e.clientY]);const d=dist(),a=[...ptr.values()];moved=99;if(pinch)zoomAt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2,pinch/d);pinch=d}});
const up=e=>{if(ptr.size==1&&moved<=6&&e.type=='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.town');if(t)select(t.dataset.name)}
 ptr.delete(e.pointerId);pinch=0;map.classList.remove('drag')};
map.addEventListener('pointerup',up);map.addEventListener('pointercancel',up);
addEventListener('resize',apply);
const mid=k=>{const r=map.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,k)};
$('zin').onclick=()=>mid(.6);$('zout').onclick=()=>mid(1/.6);$('zfit').onclick=fit;
// selection + details
let selRing;function select(n,fly){const t=towns[n];selRing?.remove();selRing=document.createElementNS(svg.namespaceURI,'circle');selRing.setAttribute('class','sel');selRing.setAttribute('cx',t.x);selRing.setAttribute('cy',t.y);selRing.setAttribute('r',6);svg.appendChild(selRing);
 document.querySelectorAll('#kings-road-towns .on').forEach(g=>g.classList.remove('on'));t.g.classList.add('on');if(fly)flyTo(t);
 const d=$('detail');d.innerHTML='';const h=document.createElement('h2');h.textContent=n;d.append(h);
 const rg=document.createElement('div');rg.className='muted';rg.textContent=t.region==='kings-road'?'Kings Road':'Ring port';d.append(rg);
 if(TOWN_INFO[n]){const p=document.createElement('p');p.textContent=TOWN_INFO[n];d.append(p)}
 const ul=document.createElement('ul'),seen=new Set();
 for(const e of adj[n]||[]){const o=e.a===n?e.b:e.a;if(!towns[o].junction&&seen.has(e.kind+o))continue;seen.add(e.kind+o);
  const li=document.createElement('li'),b=document.createElement('button');b.className='link';b.textContent=towns[o].junction?'Kings Road junction':o;if(!towns[o].junction)b.onclick=()=>select(o,1);
  li.append(b,' ');const k=document.createElement('span');k.className='leg';k.textContent=e.kind==='road'?'by road':'by sea';li.append(k);ul.append(li)}
 const c=document.createElement('div');c.className='muted';c.style.marginTop='8px';c.textContent='Connections';d.append(c,ul);
 const row=document.createElement('div');row.className='row';
 for(const[l,s]of[['Route from here',from],['Route to here',to]]){const b=document.createElement('button');b.textContent=l;b.onclick=()=>{s.value=n;route()};row.append(b)}d.append(row)}
// routing
const glow=document.createElementNS(svg.namespaceURI,'g');glow.setAttribute('fill','none');glow.setAttribute('stroke','#ffcc33');glow.setAttribute('stroke-width','5');glow.setAttribute('stroke-linecap','round');glow.setAttribute('opacity','.85');glow.setAttribute('pointer-events','none');
svg.insertBefore(glow,$('sea-routes'));
function route(){glow.innerHTML='';const A=from.value,B=to.value,out=$('result');
 if(!A||!B){out.textContent='Pick two towns, or tap one on the map.';return}if(A===B){out.textContent='Already there.';return}
 const D={[A]:0},prev={},todo=new Set([A]);
 while(todo.size){let u;for(const n of todo)if(u===undefined||D[n]<D[u])u=n;todo.delete(u);if(u===B)break;
  for(const e of adj[u]||[]){if(e.kind==='road'&&!lay.road.checked||e.kind==='sea'&&!lay.sea.checked)continue;const v=e.a===u?e.b:e.a,nd=D[u]+e.len;if(nd<(D[v]??1e9)){D[v]=nd;prev[v]=[u,e];todo.add(v)}}}
 if(D[B]===undefined){out.textContent='No route with the layers shown.';return}
 const legs=[];for(let n=B;n!==A;n=prev[n][0])legs.unshift(prev[n]);
 // merge junction hops into one leg per town-to-town stretch
 const seq=[],ids=[A];let acc=0,kind=legs[0][1].kind;let start=A;
 legs.forEach(([u,e],i)=>{const v=e.a===u?e.b:e.a;glow.append(e.el.cloneNode());acc+=e.len;
  const last=i===legs.length-1;if(!towns[v].junction||last){seq.push({a:start,b:v,kind:e.kind,len:acc});start=v;acc=0}});
 const tot=D[B],fmt=l=>'~'+(Math.round(l*KM_PER_UNIT/5)*5||5).toLocaleString('en')+' km';
 out.innerHTML='';const s=document.createElement('div');s.textContent=`${seq.length} leg${seq.length>1?'s':''}, ${fmt(tot)}`;const ol=document.createElement('ol');
 seq.forEach(l=>{const li=document.createElement('li');li.textContent=`${l.a} to ${l.b} `;const k=document.createElement('span');k.className='leg';k.textContent=`${l.kind==='road'?'road':'sea'}, ${fmt(l.len)}`;li.append(k);ol.append(li)});out.append(s,ol)}
from.onchange=to.onchange=route;
fit();
